# Deploys the internal MVM site on every push to main that could change it.
# Same shape as belt-equation/.github/workflows/deploy.yml. Needs two repository
# secrets: CLOUDFLARE_API_TOKEN (Workers Scripts: Edit) and CLOUDFLARE_ACCOUNT_ID.
# Until they exist the workflow fails at the deploy step and nothing is published.
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scripts/export_site.py"
      - "site/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Validate the project map
        run: python3 scripts/export_site.py --check
      - name: Install and build
        working-directory: site
        run: |
          npm ci
          npm run build
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: deploy
