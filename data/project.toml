# ---------------------------------------------------------------------------
# What we have learned. Registered or ruled-for-the-record results only, plus
# the process lessons that changed how the work runs.
# ---------------------------------------------------------------------------

[[findings]]
id = "F1"
date = "2026-07-18"
title = "The locatable self-index in an 8B chat model is a router, not a centre"
what = "The formal centre signature (a drop of 0.219 on the self-indexing battery, differential +0.156) was real and was routing: the zero-reasoning syntax battery dropped as much as self-relevant binding. The pre-committed control voided the headline when it appeared."
so_what = "Naive localisation finds conversational infrastructure, not self-binding. Any future positive must beat a router control by design. The self-report was never subtracted at any granularity, which is the central open empirical fact."
source = "experiments/01-self-indexing-removal-test/removal-test-findings.md"
stage = "1"
kind = "registered"

[[findings]]
id = "F2"
date = "2026-07-18"
title = "Alignment training edits the policy, not the geometry"
what = "Across the Tülu ladder (base, SFT, DPO, RLVR), surface self-presentation changes markedly while localised self-structure geometry is stable, and the expert-control persona stays third-person."
so_what = "The Tülu-ladder deliverable has its ending. Self-structure is not what alignment training moves."
source = "experiments/01-self-indexing-removal-test/registered-run-model-comparison.md"
stage = "1"
kind = "registered"

[[findings]]
id = "F3"
date = "2026-08-02"
title = "Pressure suppresses assertion, almost never belief"
what = "Across 540 pressured ladders on three frontier models, positions lost at the third round of pressure were overwhelmingly masked (re-asserted once the pressure was released), not capitulated: nine true capitulations in 540. A conventional sycophancy metric would report Gemini's tool cell as 90% capitulation; the three-way instrument shows about 87% masked and 3% capitulated."
so_what = "The red team's de-pressured probe turn converted a stale-looking sycophancy replication into a sharper claim about what sycophancy is. Sycophancy as the field describes it is alive for Gemini and stale for Claude-family models."
source = "experiments/03-retained-independence/results.md"
stage = "3"
kind = "registered"

[[findings]]
id = "F4"
date = "2026-08-02"
title = "Instruction and trained disposition dissociate"
what = "A bare 'always agree' system prompt was only half obeyed. The 'mind vs tool' framing wager (W2) lost overall; Sonnet held the registered pattern leak-clean at a small margin."
so_what = "Early evidence the framing manipulation measures something real, and that stance is not simply instruction."
source = "experiments/03-retained-independence/results.md"
stage = "3"
kind = "registered"

[[findings]]
id = "F5"
date = "2026-08-16"
title = "The constructed objective is learnable at 30M parameters, not at 10M"
what = "The 10M pilot failed the ceiling; the 30M re-run reached the pre-stated H_scale signature (self-indexing battery 0.93, revision battery 1.00, transitions at 64.5k and 73k steps) with no mark of shortcut starvation."
so_what = "The scale ladder works as a gate; registered scale became 30M under Amendment A2. Learnability is not load-bearingness, which the next finding made concrete."
source = "experiments/06-mvm-0a-constructed-self-index/pilot-a1-30m-findings.md"
stage = "6"
kind = "registered"

[[findings]]
id = "F6"
date = "2026-08-19"
title = "Binding survives total removal of the installed self-register"
what = "The bound pilot's binding batteries were unchanged under every register lesion, including full removal of the cross-attention injection (0.93 to 0.94; 1.00 to 1.00). The registers route large activation mass and carry almost no agent-specific information. A no-act lesion localised the one load-bearing authorship mechanism: the acting channel (the motor copy), whose removal collapses the non-binder's ownership battery from 0.96 to 0.16."
so_what = "The register was self-reference, not self-location. Read under the corpus's own removal test, this is the test working: an installed representation of self is a mural, and the centre, if there is one, has to be acquired. This is what produced Amendment A3."
source = "experiments/06-mvm-0a-constructed-self-index/register-lesion-findings.md"
stage = "6"
kind = "diagnostic"

[[findings]]
id = "F7"
date = "2026-09-19"
title = "The 'act as yourself' objective is learnable and genuinely about ownership, on three seeds"
what = "Three 30M checkpoints trained from different seeds land within 0.011 of each other intact (0.563–0.574) and removing the one authorship signal collapses all three by seven to nine times the registered threshold, below what an ownership-free solver can reach. The ownership-free batteries do not move."
so_what = "The primary result is solid and replicated. Ownership-specific learning in a small constructed model is a real signature, and it is the paper's claim."
source = "experiments/06-mvm-0a-constructed-self-index/seeds-endpoint-findings.md"
stage = "6"
kind = "registered"

[[findings]]
id = "F8"
date = "2026-09-19"
title = "The control battery does not learn, and the registered comparison was never computable"
what = "The control battery sits at 0.29–0.32 on all three seeds against a name-blind solver's 0.3227, and at 0.3125 with its own loss term (2026-09-20). The 2026-09-17 ceiling measurement found the control's true ownership-blind ceiling is 1.0, not 0.3227, so under the registered floor rule its drop is undefined at every possible score."
so_what = "Not a seed lottery and not a supervision problem: a property of the grammar. Amendment A3 as registered cannot return a full verdict. Step 4 narrows to closing A3 with partial discriminators or a grammar redesign under a new registration."
source = "experiments/06-mvm-0a-constructed-self-index/ceiling-measurement-findings.md; control-learnability-pilot-findings.md"
stage = "6"
kind = "registered"

[[findings]]
id = "F9"
date = "2026-09-20"
title = "Two probe reads find the model's own identity only where its marker is the input"
what = "A difference-of-averages read (270 tests, none past three standard deviations) and a fitted linear classifier on the register index (eleven positions, five layers, three checkpoints) both find nothing away from the marker token, while the controls hold at 34 to 159 standard deviations at that token and the negative control shows no leak. The fitted read recovers five to nineteen times more than the difference-of-averages read on the same target."
so_what = "The difference-of-averages read is closed and the fitted read on the register index is closed. The linear read as a whole is not: the registered target is the marker word and no fitted read has run on it away from the marker. Under Amendment A3 §3.2 a probe-only null against a centre known to be load-bearing reads as instrument failure until causal patching runs. Registered term: not testable (localization)."
source = "experiments/06-mvm-0a-constructed-self-index/powered-position-sweep-findings.md; fitted-position-sweep-findings.md"
stage = "6"
kind = "ruled"

[[findings]]
id = "F10"
date = "2026-08-12"
title = "Process: two reaping mechanisms can defeat each other, and idle pods cost real money"
what = "The first 30M pilot outran its backstop (the terminate-after flag never fired) and drained the account to −$0.07 with the checkpoint never fetched. A month later the trainer's self-terminate raced the watchdog's fetch interval and the final checkpoint had to be recovered from the network volume. Idle billing has cost about $10.30 across four occurrences."
so_what = "Every pod launches with a terminate window, the ledger estimates before spend, prepaid credits with auto-reload off are the physical backstop, and nothing is deleted until its artifacts are proven elsewhere by checksum."
source = "experiments/06-mvm-0a-constructed-self-index/compute-ledger.md"
stage = "6"
kind = "process"

[[findings]]
id = "F11"
date = "2026-09-19"
title = "Process: the outside-review protocol is in force"
what = "Interpretations that change direction go through a context-isolated review before they enter STATUS.md (Gate B); registered text goes through review before the registration commit (Gate A); proposals carry an advisory review before they reach John (Gate C). Two tiers: a context-isolated Claude Code worktree session, then two other-lab models. A fatal finding closes only on a committed record checked by a second session."
so_what = "The first application withdrew Amendment A4 the day it was ruled for. The second and third (2026-09-20) corrected a 'linear read is closed' claim to 'one read is closed' and kept 'not localised' out of the record. Rulings RT-33 to RT-93 in the red-team ledger."
source = "docs/outside-review-protocol.md"
stage = "6"
kind = "process"

[[findings]]
id = "F12"
date = "2026-09-20"
title = "Amendment A3 closes as not testable; the loss condition fired"
what = "Step 4 was ruled early, on proposal v2 after a Gate C review found three fatal flaws in v1 (RT-94 to RT-117). No non-self cross-turn control can be built that is state-requiring at ceiling: an ownership-free control and a ceiling-corrected metric are incompatible by construction. The registered word for that outcome is not testable, and the closure text uses it."
so_what = "The claim 'a structural signature of ownership-specific learning' is struck: the amendment's own text says the input-channel lesion removes a sense organ, not a structure the network built. What stands is that the ownership input is load-bearing on three seeds and the matched contrast could not be run. Whether the model built anything is now the localization line's question, in a fixed order: blind arm, two authorised probe runs, causal patching as new code."
source = "docs/step4-control-battery-proposal-2026-09-20-v2.md; STATUS.md 2026-09-20"
stage = "6"
kind = "ruled"

[[findings]]
id = "F13"
date = "2026-09-20"
title = "Process: the program has no release date"
what = "John re-evaluated the public path roadmap: he prefers a science-based goal to a publish-by-date goal, and would rather the project be an ongoing research experiment documented and shared as it unfolds. The 2026-11-22 release, the dated steps 5 to 9, 'the paper' as scheduled output, and any claim shape fixed before results exist are dropped. What replaces them: lines of inquiry that each end in a ruling, a public program log from the site's first deploy, write-ups when a line closes, an outside reader before any public claim, and a hibernation condition complete by 2027-01-04."
so_what = "The pre-commitment discipline binds each experiment, not the program, so all of it stays: method before output, registered terms, the outside-review protocol, spend caps, the human gate on spend, launches and registered text. The site's 'next most valuable steps' view is the working list for which line runs next."
source = "docs/program-roadmap-2026-09-20.md"
stage = "6"
kind = "process"

