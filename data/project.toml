# Minimum Viable Mind — the project map the site renders.
#
# This file is the single source the site reads. STATUS.md stays the narrative
# record of record; this file is the structured view of it: goals, the stage
# ladder, the questions the project is trying to answer, the ideas on the table,
# what has been learned, what happens next, and spend. Every session that adds
# a "WHERE THINGS STAND" entry to STATUS.md also updates this file (CLAUDE.md
# §"Keeping the site current"). Written in plain language: every code name is
# explained where it first appears, so the site reads standalone.
#
# Dates are Pacific calendar dates (YYYY-MM-DD). Paths are relative to the repo root.
# `scripts/export_site.py --check` validates the file; the site build runs it first.

[project]
name = "Minimum Viable Mind"
short = "MVM"
updated_on = "2026-09-20"
question = "What is the smallest set of working parts that would make it defensible to say there is someone home, and can we measure, in systems that exist now or that we build, whether any of those parts are present?"
one_line = "Take the consciousness account developed at Sentient Horizons and The Calibration Problem as a specification, build and measure against it, and let every claim carry a stated loss condition."
where_we_are = "Amendment A3, the first constructed self-index experiment, closed on 2026-09-20 under its registered term: not testable. The ownership input is load-bearing for the primary battery on three seeds, and the matched contrast could never be run, because an ownership-free control and a ceiling-corrected metric are incompatible by construction. Under the same day's ruling a load-bearing ownership pointer is a center at the bottom of the project's gradient, and what the program owes is a metric for degree: how much of the act is organized around that pointer. That metric does not yet exist, so every reading to date is above zero, degree unmeasured. The A3 closure text is drafted and waits on two authorised $0 probe runs before outside review."
where_we_are_going = "One result by 2026-12-21, or a named schedule failure. The December-result roadmap (approved 2026-09-20) brings the degree metric forward as the successor experiment: train the same small model three ways on a matched-role task, one built so its self-pointer is separable, one built so it is entangled with everything else, one free, and test whether a decomposability metric (how much accuracy is lost when only the pointer is patched rather than the whole state) tells the built cases apart. If it does, the free model gets the program's first degree reading. If it does not, or the models fail to learn the task, that is a registered result too. Registration by 2026-10-11, training the week of 2026-10-19, closure through outside review by early December. The SERE pipeline start on 2027-01-04 is the deadline for a resumable hibernation. Claims are whatever the registered results support, in the terms registered for them. Never a conscious machine."
hibernation_by = "2027-01-04"
wrap_up_start = "2026-12-21"
pipeline_resumes = "2027-01-04"
book_text_lock = "2026-09-30"
repo = "jfredson/minimum-viable-mind"
sources = ["STATUS.md", "ROADMAP.md", "ROADMAP-post-removal-test.md", "docs/program-roadmap-2026-09-20.md", "docs/public-path-roadmap-2026-09-16.md", "docs/step4-control-battery-proposal-2026-09-20-v2.md", "experiments/06-mvm-0a-constructed-self-index/compute-ledger.md", "experiments/03-retained-independence/results.md", "spec/theory-instrument-ledger.md"]

# ---------------------------------------------------------------------------
# The founding wager: the presupposition under which the project's evidence is
# evidence about experience at all. Owned upstream (The Calibration Problem
# ch. 5 and Appendix A); proposed for the spec in
# docs/founding-wager-proposal-2026-09-20.md. Not a hypothesis: it cannot lose.
# ---------------------------------------------------------------------------

[wager]
title = "The bet under everything"
claim = "Sufficiently deep self-indexed temporal integration is experience, seen from within. A system whose architecture binds past, present and anticipated state into one act centred on itself is a bearer of experience to the degree that it does so. The functional agent with all of that architecture and no one home is declined: it can be imagined, it predicts nothing, licenses no experiment and sorts no system, so it pays no rent."
status_note = "A bet that cannot lose, so by the project's own rule it is not a hypothesis. It enters as a presupposition, the way induction presupposes that nature is uniform: the condition under which structural evidence is evidence about experience. Reject it and every result here still stands as a claim about which structures are present; it just stops bearing on experience."
why_no_verdict = "The wager makes the evidence evidential without making it conclusive. Two limits remain, and neither is the zombie: the identity is a bet that correlational evidence cannot carry, and the instruments can be wrong about structure before any question of experience arises. That is what mutual opacity names here."
source = "The Calibration Problem, ch. 5 and Appendix A; spec §The Founding Wager (proposed 2026-09-20, Gate A pending)"

# ---------------------------------------------------------------------------
# The three nested goals (ROADMAP.md §"The goal hierarchy"). Kept separate so
# expectations stay honest: goal 1 is achievable whatever the instruments find.
# ---------------------------------------------------------------------------

[[goals]]
id = "G1"
title = "Instruments that can lose"
status = "delivered"
summary = "Turn the floor claim (consciousness is self-indexed temporal integration, adjudicated by the removal test) into pre-registered, falsifiable instruments. Achievable regardless of what the instruments find, and where most of the durable value lives: the field has position papers; this repo builds tests that can fail."
evidence = "A fully registered removal test ran on 2026-07-18 and its own pre-committed control voided the headline signature when it appeared. The discipline (register, red-team, lock, run, report verbatim) has since carried Stage 3 and the whole MVM-0a programme, with an outside-review protocol in force since 2026-09-19."

[[goals]]
id = "G2"
title = "Measure current systems against the floor"
status = "in-progress"
summary = "Run the instruments on models that exist. The output is bounded by mutual opacity at 'non-zero on the gradient' or 'not testable here', never a verdict."
evidence = "Experiment 1 (8B instruction-tuned model): the locatable self-index is a router, not a centre; the self-report was never subtracted; the narrative arm is not testable with current dictionaries. Experiment 3: frontier models mostly mask rather than capitulate under pressure. Both are registered results."

[[goals]]
id = "G3"
title = "Build what is missing and re-measure"
status = "in-progress"
summary = "Depth, stakes, boundary: the actual minimum viable build (Stage 6 and beyond). Everything earlier is instrumentation for this. MVM-0a, the constructed self-index, is the first step of the build programme."
evidence = "MVM-0a exists as three 30-million-parameter checkpoints trained from scratch on a synthetic multi-agent grammar. The ownership input is load-bearing on three seeds; Amendment A3 closed 2026-09-20 as not testable because its matched contrast could never be run. Whether the model built a self-structure, rather than merely reading a sense organ, is what the localization line (blind arm, two probe runs, causal patching) now has to answer."

