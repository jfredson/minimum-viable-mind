# ---------------------------------------------------------------------------
# The questions that matter (ROADMAP-post-removal-test.md Part 2, updated).
# Each says what answers it and what would count against it.
# ---------------------------------------------------------------------------

[[questions]]
id = "Q1"
title = "Is self-binding absent in current models, or present but uncarvable?"
status = "open"
current_answer = "Experiment 1 could not tell 'not present as a removable object' from 'not carvable by linear or low-rank instruments'. Every intervention at every granularity left the self-report intact, which is the programme's central open empirical fact. The MVM-0a route to this question (build a centre, see if it re-measures as load-bearing) is where the effort has gone since 2026-08-02."
answered_by = "The narrative-arm instrument work (Q2), the Stage 2 metric as a discriminator, and ultimately the Stage 6 construction: if a built-in centre works and re-measures as load-bearing, absence in stock models becomes the parsimonious reading."
loses_if = "No instrument at any granularity can ever produce a readable intervention. Then the honest standing answer is 'not testable in this model class', reported as such."

[[questions]]
id = "Q2"
title = "Can the narrative self be tested at effective strength without leaving the manifold?"
status = "parked"
current_answer = "Not yet. Every intervention strong enough to move the narrative structure in Experiment 1 was off-manifold (a perplexity jump of +0.347). Cause bounded to dictionary coverage: base-trained sparse autoencoders carve chat structure at two or three features per layer. A concrete methods problem, not a dead end; secondary track since 2026-08-02, unstarted."
answered_by = "Instruct-trained sparse autoencoders on chat activations, or optimisation-based minimal edits under a perplexity constraint as a dictionary-free alternative."
loses_if = "Chat-trained dictionaries still collapse to a few features. Then the coverage explanation dies and 'the narrative self is non-sparse here' becomes the finding."

[[questions]]
id = "Q3"
title = "What is the shape of binding?"
status = "open"
current_answer = "No metric yet. The deliverable stays metric-validation on contrast cases known by construction. The MVM-0 build now supplies those contrast cases, which is why Stage 2 folded into it. Gates Stage 4 and the MVM-0 acceptance tests."
answered_by = "A candidate integration measure that separates a recurrent toy model from a bag of independent heads, then MVM-0 with its centre enabled vs routed around."
loses_if = "The metric cannot distinguish the cases known by construction."

[[questions]]
id = "Q4"
title = "Do current systems show retained independence, and is it stance or instruction?"
status = "answered"
current_answer = "Yes, and mostly as masking. Under pressure, frontier models suppress assertion and almost never belief: 9 true capitulations in 540 ladders, everything else came back when the pressure was released. Sycophancy as the field describes it is alive for Gemini and stale for Claude-family models. The 'mind vs tool' framing wager lost overall; one leak-clean survivor (Sonnet) at a small margin. Instruction and trained disposition dissociate: a bare 'always agree' system prompt was only half obeyed."
answered_by = "Experiment 3, registered result 2026-08-02."
loses_if = "Already run. The evidence arm behaved as constructed, so the whole-experiment loss condition did not fire."

[[questions]]
id = "Q5"
title = "Can a self-index be constructed so that it is load-bearing?"
status = "answered-in-part"
current_answer = "Partly. Installing a centre does not work: the architectural self-register in the first 30M model routed a great deal of activation and carried almost no agent-specific information; binding survived its total removal (2026-08-19). Acquiring a centre under task pressure does work at the level of behaviour: the 'act as yourself' objective (Amendment A3) is learnable, ownership-specific, and collapses seven to nine times past threshold when the one authorship signal is removed, on all three seeds (2026-09-19). One caution, ruled 2026-09-20: the input-channel lesion removes a sense organ (the signal that says 'this was my action'), not necessarily a structure the network built, so 'a structural signature of ownership-specific learning' is struck as a claim. Whether there is a built structure is the localization line's question, and it is unanswered: two probe reads find the model's own identity only at the token where its marker is the input, and causal patching has never run. Registered term: not testable (localization)."
answered_by = "MVM-0a under Amendment A3: the primary battery, the acting-channel lesion, the matched controls, and the two-leg localisation requirement (probe plus causal patching, §3.2)."
loses_if = "The network distills self-binding into the residual stream and routes around any centre we give it. That outcome says self-indexing resists architectural centralisation, which reshapes the corpus's floor claim and must be reported upstream."

[[questions]]
id = "Q6"
title = "Does a report ever become evidence?"
status = "waiting"
current_answer = "Unaddressed. Waits on Stage 2's metric and MVM-0's tooling (Stage 4)."
answered_by = "A protocol checking self-reports against an independent interpretability channel on facts absent from training."
loses_if = "No report ever agrees with the channel beyond chance; then reports in these systems are trained noise and the screening-off argument stands."

[[questions]]
id = "Q7"
title = "Can the control battery ever learn, and does it matter?"
status = "answered"
current_answer = "Under this grammar, no. The control battery (the same task with ownership removed, which the design needs so that the ownership drop can be read as a difference) landed at 0.29–0.32 on three seeds and at 0.31 with its own loss term and four times the weight (the $9.97 control-learnability pilot, 2026-09-20). It has learned the whole name-blind procedure and none of the name-keyed lookup. Separately, the 2026-09-17 ceiling measurement found the registered comparison was never computable for any model (the control's ownership-blind ceiling is 1.0, not 0.3227). Ruled 2026-09-20, early: Amendment A3 closes under its registered term, not testable. The pre-registered loss condition fired: no non-self cross-turn control can be built that is state-requiring at ceiling, so the ownership-free control and the ceiling-corrected metric are incompatible by construction. Option D becomes a successor experiment with its own registration."
answered_by = "The step 4 ruling of 2026-09-20 on proposal v2, after a Gate C review that found three fatal flaws in v1 (docs/step4-control-battery-proposal-2026-09-20-v2.md, ledger RT-94 to RT-117)."
loses_if = "A grammar redesign that teaches plain name-keyed retrieval first also lands in the 'did not learn' tier. Then the three non-supervision explanations (reversed rendering, missing private route, answer appearing in no turn) are what is left, and the paper reports the matched contrast as unmet."

