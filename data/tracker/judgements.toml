# ========================================================== commitment judgements
# THE RULE NOW (updated 2026-11-21): ruling D (John, 2026-11-20, "Yes, that test"), which
# replaced the wording below the same day. A prediction counts for a study if the theory's
# proponents fixed it before they could have known the study's result: before the study's
# registration, for a study registered before its data were collected; before its earliest
# public appearance, for any other study; before the data first appeared, for a reanalysis.
# For a study run by the theory's own supporters, before their lab had the data, shown by a
# registration or the paper's methods dates, and before any earlier paper in which the same
# lab published that result (John, 2026-11-21, "Yes, own-lab dating"). Readers who split on
# commitment make it unclear (John, 2026-11-20). The five-year convention below is dropped.
# The pilot's first readings were made under the earlier wording, kept below for the record.
#
# Earlier wording: question for each, under the rule as ruled by John on 2026-11-20 ("Yes, count it";
# kickoff section 12, rule 2.1): was this prediction fixed, by the theory's
# proponents, in a dated record (a publication or a registration) made before the
# study's data were collected? What decides is when the record was fixed, not when it
# became public. A paper that states a prediction and tests it in the same paper still
# does not count. Verdicts: "before" (counts), "not-before" (listed, not counted),
# "unclear" (not counted, rule 2.3).
#
# The first reader's convention where a study does not date its data collection
# (stated so the second reader and John can test it; it is a reading, not a rule):
# a record fixed five or more years before the study's earliest public appearance is
# read as fixed before its data were collected; a shorter gap, with no stated
# collection date, is read as unclear.

