# ========================================================== commitment judgements
# Question for each: was this prediction on record, in a dated publication by the
# theory's proponents, before the study first appeared? Verdicts: "before" (counts),
# "not-before" (listed, 'explained afterwards, not counted' or 'first stated in the
# study's own registration, not counted'), "unclear" (not counted, rule 2.3).

[[judgement]]
id = "com-cogitate-gwt-pfc-content"
kind = "commitment"
prediction = "gwt-pfc-content"
study = "cogitate-2025"
passages = [
  { source = "dehaene-2014", text = "Global information sharing and routing would rely on a set of interconnected high-level cortical regions forming a ‘global workspace’ and involving primarily the dorsolateral prefrontal cortex, but also additional hubs in inferior parietal cortex, mid-temporal cortex, and precuneus" },
  { source = "dehaene-2014", text = "In order to be globally shared, conscious information should be represented by a stable and reproducible brain-scale assembly for a minimal duration." },
]
dates = { statement = "2013-12-29", study = "2019-01-16" }
[[judgement.reading]]
reader = "claude"
model = "claude-opus-5-5"
date = "2026-11-20"
order = "first"
verdict = "before"
reason = "Five years before the registration, the proponents said conscious information is globally shared by a workspace 'involving primarily the dorsolateral prefrontal cortex' and must be 'represented by a stable and reproducible brain-scale assembly'. That commits the theory to conscious content being represented in prefrontal cortex."
unsure = true
unsure_why = "The 2014 passage does not say the content must be decodable when the stimulus is irrelevant to the task, and the same paper allows that task-irrelevant perception 'may correlate solely with a transient posterior negativity'. A reader may say the task-free part was first committed in the 2019 registration."

