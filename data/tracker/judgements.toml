# ========================================================== commitment judgements
# Question for each, under the rule as ruled by John on 2026-11-20 ("Yes, count it";
# kickoff section 12, rule 2.1): was this prediction fixed, by the theory's
# proponents, in a dated record (a publication or a registration) made before the
# study's data were collected? What decides is when the record was fixed, not when it
# became public. A paper that states a prediction and tests it in the same paper still
# does not count. Verdicts: "before" (counts), "not-before" (listed, not counted),
# "unclear" (not counted, rule 2.3).
#
# The first reader's convention where a study does not date its data collection
# (stated so the second reader and John can test it; it is a reading, not a rule):
# a record fixed five or more years before the study's earliest public appearance is
# read as fixed before its data were collected; a shorter gap, with no stated
# collection date, is read as unclear.

[[judgement]]
id = "com-cogitate-gwt-pfc-content"
kind = "commitment"
prediction = "gwt-pfc-content"
study = "cogitate-2025"
passages = [
  { source = "cogitate-prereg-v1", text = "In short, GNW predicts that the content of consciousness should be decodable from prefrontal areas, whereas IIT predicts that they should be maximally decodable from posterior areas." },
  { source = "dehaene-2014", text = "Global information sharing and routing would rely on a set of interconnected high-level cortical regions forming a ‘global workspace’ and involving primarily the dorsolateral prefrontal cortex, but also additional hubs in inferior parietal cortex, mid-temporal cortex, and precuneus" },
  { source = "cogitate-protocol-2023", text = "The original and the amended preregistration files were frozen prior to the commencement of data acquisition." },
]
dates = { statement = "2013-12-29 (dehaene-2014); 2019-01-16 (the registration)", data_collected = "after 2019-01-16" }
[[judgement.reading]]
reader = "claude"
model = "claude-opus-5-5"
date = "2026-11-20"
order = "first"
verdict = "before"
reason = "The proponents fixed it in the study's registration (2019-01-16), which was frozen before data acquisition began; it was also stated in 2013. Either record predates the data."
unsure = false

