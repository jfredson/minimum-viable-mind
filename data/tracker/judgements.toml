date = "2026-11-21"
order = "first"
verdict = "mixed"
reason = "Rats whose insulae were destroyed on both sides went on drinking the flavour that alcohol had made them sick after, and never came to avoid the place where it happened, while intact rats did both. If learning to avoid a taste and a place stands in for feeling bad in the body, then feelings did not survive the loss, which points against the prediction. But the measure is learning, not a report of how the animal feels, and the same lesion also removed the rats' ordinary wariness of a new flavour, so the result cannot separate a lost feeling from a lost ability to learn about a taste. The prediction itself is about what a person says and what observers see, which no rat study can supply."
unsure = true
unsure_why = "This is the shakiest reading in this batch. A reader who takes conditioned avoidance as a fair stand-in for feeling bad would read 'against'; a reader who holds that a prediction about human self-reported feelings cannot be touched by rat learning at all would say the study does not bear on it and should not have been taken. The lean, if it has to be stated, is against the prediction."

