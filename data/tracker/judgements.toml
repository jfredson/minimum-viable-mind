  { source = "oregan-noe-2001", text = "As Blackmore rightly says, according to our theory the locus of sensation will depend on the nature of the sensorimotor contingencies, and by changing these laws, it should be possible to change the locus of perception." },
  { source = "oregan-noe-2001", text = "Thus, since normally input coming through the auditory nerve will change in certain ways when the head or body moves, when later, without moving, the organism is stimulated through the auditory nerve, the stimulation will be perceived as belonging to the auditory modality. This then provides an explanation of audition without head movements. Similar arguments can be made for brief visual stimulations, phosphenes, and stimulation of visual cortex à la Penfield, as well as for phantom limbs." },
  { source = "bridgeman-2008", text = "A test of the sensorimotor theory giving it every advantage had six observers in darkness moving their fingers along the eye and observing phosphenes for 1 h and 2400 motion cycles; the phosphene always obeyed the doctrine of specific nerve energies, never adapting or changing modality as the sensorimotor theory predicts." },
]
dates = { statement = "2001-10 (oregan-noe-2001)", study_first_appeared = "2008 (bridgeman-2008, publication)" }
[[judgement.reading]]
reader = "claude"
model = "claude-opus-5-5"
date = "2026-11-21"
order = "first"
verdict = "unclear"
reason = "The dates are clear: the proponents stated in 2001 that the sense an experience belongs to follows learned patterns of how input changes with movement, seven years before the study. What is unclear is whether that statement commits the theory to the study's test. The 2001 paper gives no time scale for relearning (its own goggle example takes about two weeks, against the study's one hour), and its response says phosphenes are felt as sight because of patterns learned over a lifetime, which suggests the theory expected the phosphene to stay visual in a short test."
unsure = true
unsure_why = "A reader could say the 2001 principle ('by changing these laws, it should be possible to change the locus of perception') does commit the theory, read 'before', and then score the study against it. Another could read 'not-before', since the specific prediction (adaptation within an hour) appears first in the study itself. Only the abstract was read; the full text may say how the authors derived the prediction from the 2001 paper."

