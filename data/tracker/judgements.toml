# Judgements: every place a reader decides something, each its own record with the
# study, the passage, the reason, the reader and the date (kickoff section 5).
#
# Three kinds:
#   outcome     - did this counted study come out for, against, or mixed on this
#                 prediction? (section 4: +1, -1, 0)
#   commitment  - was the prediction fixed by the proponents in a dated record (a
#                 publication or a registration) before the study's data were
#                 collected? (section 12, rule 2.1 as ruled 2026-11-20, and rule 2.3;
#                 rule 2.3 says this is "a judgement, made as its own record and read
#                 by both readers")
#   testability - could the prediction fail, and does it separate the theory from a
#                 rival on the list? (section 4, the testability score)
#
# Readings. Each judgement holds one [[judgement.reading]] per reader. The second
# reader (Google's Gemini, ruling 7) has not read anything yet: no call has been
# made. Every reading below is the Claude reader's. On every Sentient Horizons row
# Gemini's reading will be recorded as the first reading (ruling 7b); the Claude
# reading there is marked order = "second", and the blind packet sent to Gemini
# never contains it. Until two readings agree, the score script uses the one reading
# it has and says so.
#
# Layout: data/tracker/README.md.

# ============================================================= outcome judgements

[[judgement]]
id = "out-cogitate-gwt-pfc-content"
kind = "outcome"
prediction = "gwt-pfc-content"
study = "cogitate-2025"
passages = [
  { source = "cogitate-2025", text = "On the basis of our preregistered predictions and pre-approved interpretations27 (Extended Data Table 1), the theories would pass the test if decoding is possible for both category (in at least one category pairing) and orientation (in at least one category), but would fail otherwise." },
  { source = "cogitate-2025", text = "Hence, across modalities, face–object decoding occurred in both posterior and prefrontal ROIs, consistent with IIT and GNWT predictions." },
  { source = "cogitate-2025", text = "We obtained divergent results for IIT and GNWT: decoding of face orientation (left, right or front views) was achieved in posterior but not in prefrontal ROIs, both with iEEG (Fig. 2f,h, approximately 95% with pseudotrial aggregation; Extended Data Fig. 3a) and the fMRI searchlight approach (Fig. 2g, approximately 45%). Decoding of face orientation was robust from MEG cortical time series in posterior ROIs (approximately 75% with pseudotrial aggregation), but was weaker, yet above chance (35%), in prefrontal ROIs (Fig. 2i), with a possibility of signal leakage from posterior regions (Extended Data Fig. 3b)." },
  { source = "cogitate-2025", text = "although we found representation of category in PFC irrespective of the task, thereby demonstrating the sensitivity of our methods, no representation of identity was found, and representation of orientation was evident only in MEG (signal leakage notwithstanding); although these dimensions were clearly a part of the conscious experience of participants of the stimuli." },
]
[[judgement.reading]]
reader = "claude"
model = "claude-opus-5-5"
date = "2026-11-20"
order = "first"
verdict = "mixed"
reason = "The category of what was seen was decodable from prefrontal cortex regardless of task, as predicted. Orientation, which participants also saw, was not decodable there by two of three methods, and only weakly by the third with possible leakage; identity was not decodable there at all. The registered pass required both category and orientation. Part of the prediction holds and part fails."
unsure = true
unsure_why = "Whether the MEG orientation result (above chance, possible leakage) meets the registered orientation criterion decides between 'mixed' and 'for'. The consortium's own summary calls GNWT's broadcasting prediction 'partly supported', which this reading follows."

[[judgement]]
id = "out-cogitate-gwt-ignition"
kind = "outcome"
prediction = "gwt-ignition"
study = "cogitate-2025"
passages = [
  { source = "cogitate-2025", text = "By contrast, GNWT predicts brief, content-specific ignition in PFC within 0.3–0.5 s after stimulus onset, as the workspace is updated12." },
  { source = "cogitate-2025", text = "In PFC ROIs, 99 and 24 electrodes showed non-selective and category-selective onset responses, respectively (Fig. 3c). However, none of the 655 electrodes measured the temporal profile predicted by GNWT (that is, onset and offset)." },
  { source = "cogitate-2025", text = "This result is unlikely to stem from sensitivity limitations, as offset responses were robustly found elsewhere (for example, visual areas); and in PFC, strong onset responses were found to the very same stimuli." },
]
[[judgement.reading]]
reader = "claude"
model = "claude-opus-5-5"
date = "2026-11-20"
order = "first"
verdict = "for"
reason = "Every stimulus in this experiment was consciously seen. Prefrontal cortex responded at the onset of each new percept (123 onset-responsive electrodes, some category-selective), which is the 'where every stimulus is seen' half of the test wording. The missing offset response belongs to a different prediction (gwt-offset), first written in this study's own registration and so not counted here."
unsure = true
unsure_why = "The experiment had no unconscious trials, so it cannot show the contrast at the heart of the prediction (a response for seen stimuli that unseen ones lack), and the paper does not report whether the onset responses were 'sudden and late' in the predicted window. Splitting onset from offset follows the dates rule, but the consortium scored onset and offset together and found the joint pattern absent; a reader who will not split them would read 'against'."

[[judgement]]
id = "out-cogitate-gwt-synchrony"
kind = "outcome"
prediction = "gwt-synchrony"
study = "cogitate-2025"
passages = [
  { source = "cogitate-2025", text = "On the basis of our preregistration (see Extended Data Table 1), IIT would be challenged in the absence of sustained content-specific synchronization between face–object selective areas and V1/V2; whereas a challenge for GNWT would be a lack of phasic connectivity (0.3–0.5 s) between category-selective areas and PFC." },
  { source = "cogitate-2025", text = "No content-selective PPC was found between face-selective and object-selective electrodes and PFC electrodes in the relevant time window, contradicting the prediction of GNWT (Extended Data Fig. 6a; BF01 = 2.62–5.32)." },
  { source = "cogitate-2025", text = "The results of the preregistered PPC metric for prediction 3, critical for both IIT and the GNWT, supported neither theory." },
  { source = "cogitate-2025", text = "The exploratory DFC results in iEEG were consistent with the predictions of GNWT while challenging the predictions of IIT, as connectivity with V1/V2 was not sustained." },
]
[[judgement.reading]]
reader = "claude"
model = "claude-opus-5-5"
date = "2026-11-20"
order = "first"
verdict = "against"
reason = "By the measure agreed in advance (pairwise phase consistency), there was no content-specific synchrony between category-selective areas and prefrontal cortex in the predicted window, which the paper calls contradicting the prediction. A second measure, chosen afterwards, was consistent with it; a measure chosen after the data does not undo the registered test."
unsure = true
unsure_why = "A reader who weighs the exploratory connectivity measure and the fMRI connectivity result (face area to inferior frontal gyrus) equally with the registered one would read 'mixed'."

[[judgement]]
id = "out-bellet-gwt-pfc-content"
kind = "outcome"
prediction = "gwt-pfc-content"
study = "bellet-2022"
passages = [
  { source = "bellet-2022", text = "We report that the identity of each stimulus could be decoded from PFC population activity even in the RSVP condition." },
  { source = "bellet-2022", text = "Due to the lack of subjective report under the present RSVP conditions, two interpretations of the data remain tenable: macaques could either be very fast in perceiving the stimuli or most of the stimuli could have remained unconscious." },
  { source = "bellet-2022", text = "The main limitation of the present study is the absence of behavioral reports that could have provided insight as to whether any of the signals we have decoded are correlates of consciousness." },
]
[[judgement.reading]]
reader = "claude"
model = "claude-opus-5-5"
date = "2026-11-20"
order = "first"
verdict = "mixed"
reason = "Prefrontal neurons carried detailed information about pictures with no report required, which fits the prediction. But the prediction is about what is consciously seen, and the authors say they cannot tell whether the monkeys saw the pictures; if the pictures stayed unconscious, prefrontal coding of them is not what the theory predicts. The study neither confirms nor contradicts the prediction."
unsure = true
unsure_why = "The rules have three outcomes (for, against, mixed) and no 'does not bear on it'. 'Mixed' is used here for a result that cannot tell the two apart, which pulls the support score toward the middle. A reader could reasonably say 'for' (the authors' own reading: 'Our results also support a prediction of the GNW model')."

