passages = [
  { source = "wilterson-2021-tpj", text = "Fig. 2B shows that attention was directed to the location predicted by the cue, since the mean ΔRT among subjects was significantly greater than 0 (mean ΔRT = 12.66 ms, SEM = 2.70, two-tailed t test, df = 17, t = 4.70, and P < 0.001)." },
  { source = "wilterson-2021-tpj", text = "Thus, there was no evidence that attention was directed to the location predicted by the cue in task 2 (mean ΔRT = 0.86 ms, SEM = 2.81, two-tailed t test, df = 16, t = 0.31, and P = 0.762)." },
  { source = "wilterson-2021-tpj", text = "The attention effect was significantly greater in task 1 than in task 2 (difference = 11.79 ms, SEM = 3.89, between-subjects, two-tailed t test, df = 33, t = 3.033, and P = 0.0047)." },
  { source = "wilterson-2021-tpj", text = "Prior experiments showed that the cue, though outside awareness, could still draw exogenous attention to itself (8)." },
]
[[judgement.reading]]
reader = "claude"
model = "claude-opus-5-5"
date = "2026-11-21"
order = "first"
verdict = "for"
reason = "People who saw the cue learned, without knowing it, to shift attention to where the cue predicted the target; people for whom the cue was masked showed no such shift, and the difference between the groups was significant. That is the prediction's 'for' case: without awareness of the cue, the deliberate use of it to steer attention was lost."
unsure = true
unsure_why = "The 'attention can still be drawn to it' half of the test was not measured in this study; it rests on the same lab's earlier paper (wilterson-2020), which was not opened. The two conditions were also run on different people, and the masked cue may simply have been processed too weakly to learn from, which would explain the result without any role for awareness. A reader who insists both halves be shown in the same study would read 'mixed'."

