# Per-prediction study searches for the five theories ConTraSt does not cover.
# Ruled by John, 2026-11-21, "Yes, cap $10 (Recommended)": studies for Seth's view, attention
# schema theory, the sensorimotor theory, Orchestrated Objective Reduction and Damasio's theory are
# found by a fixed search per prediction, not by the theory's name, for all 37 predictions; each
# search is written down and committed before it runs; the five-most-recent rule is kept.
# This file was written and committed on 2026-11-21 BEFORE any of these searches was run.
#
# THE METHOD (fixed here, before any result is seen)
# 1. Each query runs once on the Europe PMC REST search
#    (https://www.ebi.ac.uk/europepmc/webservices/rest/search), sorted newest first
#    (sort = "P_PDATE_D desc"), on the date it is run. The query string is used exactly as below.
#    The run records the date, the hit count and every result screened.
# 2. Screening, per query, in order, up to the first 40 results. A result QUALIFIES when its
#    title or abstract shows that it (a) reports new data, or a reanalysis, from people, animals,
#    tissue, a physical system or an artificial agent; and (b) measures what the prediction's own
#    test wording (test_for / test_against) names, so that its result could count for or against it.
#    Reviews, theory papers, models and simulations with no new data, comments, protocols and
#    preprints of a paper already listed do not qualify. Whether a paper names the theory does not
#    matter.
# 3. Choosing, per theory: the five most recent qualifying studies across all its predictions'
#    result lists (by earliest public appearance), taking AT MOST ONE study per prediction, so that
#    no single busy topic fills all five places. (This cap is the method's own choice, made here
#    before the run, not a ruling; it is reported to John.) A study qualifying for two predictions
#    is taken once and judged for both. A study whose full text cannot be opened openly still takes
#    its place, is recorded as not opened, and goes on the verify list, as in the pilot.
# 4. Predictions that cannot fail with today's methods (John, 2026-11-21, "With today's methods")
#    are searched like the rest, so the record shows it; a study can count for them only if it
#    measures what their test wording names.
# 5. Studies already in the records are not excluded; if one qualifies it is reused by its id.
#
# Each query is built from the prediction's own test wording. Every query ends in "AND SRC:MED"
# (journal articles indexed in MEDLINE) unless it says otherwise.

# ============================================================ Seth's living-body view

[[search]]
prediction = "seth-living-only"
query = '(TITLE_ABS:"artificial consciousness" OR TITLE_ABS:"machine consciousness" OR TITLE_ABS:"consciousness in artificial") AND (TITLE_ABS:living OR TITLE_ABS:life OR TITLE_ABS:biological) AND SRC:MED'

[[search]]
prediction = "seth-ai-not-by-computation"
query = '(TITLE_ABS:"large language model*" OR TITLE_ABS:"artificial intelligence") AND TITLE_ABS:conscious* AND (TITLE_ABS:test* OR TITLE_ABS:indicator* OR TITLE_ABS:experiment*) AND SRC:MED'

[[search]]
prediction = "seth-expectation-speeds-access"
query = '(TITLE_ABS:expectation* OR TITLE_ABS:predictab* OR TITLE_ABS:"prior knowledge") AND (TITLE_ABS:"continuous flash suppression" OR TITLE_ABS:"access to awareness" OR TITLE_ABS:"conscious access" OR TITLE_ABS:"breakthrough") AND SRC:MED'

[[search]]
prediction = "seth-presence-match"
query = '(TITLE_ABS:"sense of presence" OR TITLE_ABS:"feeling of presence" OR TITLE_ABS:depersonali*) AND TITLE_ABS:interocepti* AND SRC:MED'

[[search]]
prediction = "seth-interoceptive-ownership"
query = '(TITLE_ABS:heartbeat OR TITLE_ABS:cardiac OR TITLE_ABS:"cardio-visual" OR TITLE_ABS:"cardiovisual") AND (TITLE_ABS:"body ownership" OR TITLE_ABS:"rubber hand" OR TITLE_ABS:"full-body illusion" OR TITLE_ABS:"full body illusion") AND SRC:MED'

[[search]]
prediction = "seth-low-interoception-more-illusion"
query = '(TITLE_ABS:"interoceptive accuracy" OR TITLE_ABS:"interoceptive sensitivity" OR TITLE_ABS:"heartbeat detection" OR TITLE_ABS:"heartbeat counting" OR TITLE_ABS:"heartbeat perception") AND (TITLE_ABS:"rubber hand" OR TITLE_ABS:"ownership illusion") AND SRC:MED'

[[search]]
prediction = "seth-interoceptive-suppression"
query = 'TITLE_ABS:insula* AND TITLE_ABS:interocepti* AND (TITLE_ABS:"prediction error" OR TITLE_ABS:predictab* OR TITLE_ABS:expect*) AND SRC:MED'

[[search]]
prediction = "seth-feeling-from-prediction"
query = '(TITLE_ABS:"false heart rate feedback" OR TITLE_ABS:"false cardiac feedback" OR TITLE_ABS:"false physiological feedback" OR TITLE_ABS:"false heartbeat feedback" OR TITLE_ABS:"false interoceptive feedback") AND SRC:MED'

