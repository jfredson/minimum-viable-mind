# ------------------------------------------------------------- rule C (separation)
# The five rows where a reader said a rival disagrees and the other did not, and the
# rows whose separation, agreed by both readers, rested on something other than a rival
# proponents' publication (an audit under the same rule).

[[ruling]]
judgement = "tst-gwt-late"
rule = "C"
settles = "separation"
separates = true
separates_from = ["rpt"]
source = "lamme-2018"
passage = "Recurrent processing starts within 100 ms after stimulus presentation, at first between low-level visual areas, and then more widespread between visual cortex. Neural correlates such as V1 contextual modulation, PPI and VAN (see text) are shown. These recurrent interactions enable phenomenal (P-) consciousness of the visual stimulus: you SEE."
reason = "Recurrent processing theory's proponent puts seeing at recurrent processing from within the first 100 ms, before the late ignition the workspace prediction requires. No IIT proponents' passage on timing was found, so IIT is not named."

[[ruling]]
judgement = "tst-iit-agnosia"
rule = "C"
settles = "separation"
separates = false
separates_from = []
reason = "No opened publication by proponents of a rival (higher-order theories, global workspace theory) predicts awareness of the loss. Gemini's separation rested on its own knowledge."

[[ruling]]
judgement = "tst-sh-split-novel"
rule = "C"
settles = "separation"
separates = false
separates_from = []
reason = "No opened rival proponents' publication says anything about cutting the copies of a system's own commands; the rivals are silent, and silence does not count."

[[ruling]]
