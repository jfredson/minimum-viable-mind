# ------------------------------------------- rule C as amended (2026-11-21)
# John, 2026-11-21, "Yes, flip it" (relayed by the master session): a prediction separates a
# theory from a rival unless a rival's own opened source predicts the same thing. Silence means
# the prediction is the theory's own; a reader's own knowledge still never counts.
# How it was applied (the stage 3 session's reading, stated in the kickoff proposal): a
# separation already resting on a rival's contrary passage stands; a prediction stops
# separating only where a rival's own source predicts the same and none predicts differently.
# Re-applied to every testability judgement on all ten entries. Rows that change are below,
# each settled by this rule (rule "C2"); they replace any earlier rule-C entry for the same row.
# Rows that do not change: every row already separating on a rival's contrary passage; the ten
# rows where a rival's own source predicts the same (iit-phi-states, rpt-ff-unseen,
# rpt-feedback-needed, rpt-unattended-local, rpt-attention-independent,
# seth-interoceptive-ownership, ast-covary, ast-control, sm-change-blindness, sm-inattentional;
# see `shares_with` on each prediction); and rows that cannot fail, whose separation scores
# nothing either way.

