# Judgements settled, or partly settled, by a rule John ruled (not by either reader).
# tracker_scores.py applies these over the readings:
#   - a commitment ruling with no open_part sets the verdict; with an open_part the row
#     stays unsettled for John;
#   - a testability ruling sets "separates" for every reader; the row is settled if the
#     readers also agree on "could fail".
# Rulings of 2026-11-20, relayed by the master session for the theories tracker:
#   C, "Yes, sourced only": a prediction separates a theory from a rival only when a
#      publication by the rival's own proponents, opened and cited, predicts something
#      different. A reader's own knowledge and a rival's silence do not count.
#   D, "Yes, that test": a prediction counts for a study if the theory's proponents fixed
#      it before they could have known the study's result: before the registration, for a
#      study registered before its data were collected; before its earliest public
#      appearance, for any other study; before the data first appeared, for a study
#      reanalysing earlier published data. Stating and testing in the same paper still
#      does not count.

