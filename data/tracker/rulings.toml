separates = true
separates_from = ["damasio"]
source = "singer-damasio-2025"
passage = "Spontaneously conscious interoceptive, homoeostatic feelings are the basis for subjectivity. Consciousness proper results from the combination of subjectivity with the exteroceptive, cognitive and linguistic processes that constitute the modern mind."
reason = "Audit: both readers agreed it separates from Damasio's theory, but on a secondary quotation. Damasio's own 2025 paper makes homeostatic feeling the basis of subjectivity, so removing mattering would remove the ground of consciousness, where the account predicts only a poorer experience."

[[ruling]]
