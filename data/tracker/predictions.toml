statement = "The physical substrate of experience lies mainly in a posterior 'hot zone' (temporal, parietal and occipital cortex); prefrontal cortex is not needed, and conscious content is best decoded from the back of the brain."
stated_by = "proponent"
first_stated = { source = "cogitate-prereg-v1", date = "2019-01-16", passage = "A current auxiliary prediction of IIT, on the other hand, states that the physical substrate of consciousness resides primarily in a “posterior hot zone” in temporo-parietal-occipital cortex due to the connectivity architecture of those areas (‘pyramid-of-grids’-like) that is more suited for high phi than the different connectivity of prefrontal regions.", location = "pp. 5-6, 'Neural Activations related to consciousness'" }
first_public = { source = "cogitate-protocol-2023", date = "2023-02-10", passage = "In contrast, an auxiliary prediction of IIT states that the NCC is primarily localized to the posterior hot zone." }
also_stated = [
  { source = "cogitate-prereg-v1", passage = "Thus, for GNW, activation of prefrontal1 areas is a prequisite for conscious experience, while IIT, in contrast, submits that activity in posterior areas is necessary for consciousness.", note = "The 1 after prefrontal is the source's footnote marker; prequisite is the source's spelling." },
]
test_for = "Awareness-related activity, or decodable conscious content, is found in posterior cortex, and adding prefrontal cortex adds no information."
test_against = "Conscious content or awareness-related activity is absent from posterior cortex while present in prefrontal cortex, or prefrontal cortex adds information beyond posterior cortex."
separates_from = [
  { theory = "gwt", how = "GWT holds that prefrontal activation is a prerequisite for conscious experience.", source = "cogitate-prereg-v1" },
]
note = "The registration calls it an 'auxiliary' prediction. Whether it is tied to a core claim (here iit-c5, the main complex and its borders) is part of its testability judgement. IIT 4.0 (albantakis-2023) says the main complex's location 'should correspond to its location as determined through clinical and experimental evidence' but does not itself say where. Boly et al. 2017 (boly-2017) argue for a posterior hot zone without naming the theory. Tononi et al. 2016 and Koch et al. 2016 (Nature Reviews Neuroscience), which may state it earlier, were not opened (paywalled)."

