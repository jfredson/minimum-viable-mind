core_claim = "gwt-c3"
statement = "What is consciously seen is represented in prefrontal cortex, so that its content can be decoded there, whether or not the person has to report it or use it in a task."
stated_by = "proponent"
first_stated = { source = "dehaene-2014", date = "2013-12-29", passage = "Global information sharing and routing would rely on a set of interconnected high-level cortical regions forming a ‘global workspace’ and involving primarily the dorsolateral prefrontal cortex, but also additional hubs in inferior parietal cortex, mid-temporal cortex, and precuneus", location = "section 'Conscious processing as global information sharing', first paragraph" }
also_stated = [
