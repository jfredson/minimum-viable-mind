# Predictions: the leaves. Each is tied to one core claim of its theory, says who
# stated it first and when (the earliest proponents' publication this session
# opened that states it), and gives the test wording for and against and the
# rivals it separates the theory from.
#
# Whether a prediction "could fail" and whether it "separates" the theory from a
# rival are judgements, not facts: they live in judgements.toml as testability
# judgements, read by both readers. The fields here record what the sources say.
# Layout: data/tracker/README.md.

# ======================================================== global workspace theory

[[prediction]]
id = "gwt-pfc-content"
theory = "gwt"
core_claim = "gwt-c3"
statement = "What is consciously seen is represented in prefrontal cortex, so that its content can be decoded there, whether or not the person has to report it or use it in a task."
stated_by = "proponent"
first_stated = { source = "dehaene-2014", date = "2013-12-29", passage = "Global information sharing and routing would rely on a set of interconnected high-level cortical regions forming a ‘global workspace’ and involving primarily the dorsolateral prefrontal cortex, but also additional hubs in inferior parietal cortex, mid-temporal cortex, and precuneus", location = "section 'Conscious processing as global information sharing', first paragraph" }
also_stated = [
  { source = "dehaene-2014", passage = "In order to be globally shared, conscious information should be represented by a stable and reproducible brain-scale assembly for a minimal duration." },
  { source = "cogitate-prereg-v1", passage = "In short, GNW predicts that the content of consciousness should be decodable from prefrontal areas, whereas IIT predicts that they should be maximally decodable from posterior areas." },
  { source = "mashour-2020", passage = "In monkeys, however, recordings in the prefrontal cortex show that prefrontal neurons encode, in firing patterns, the specific current content of consciousness during binocular rivalry and related paradigms (Panagiotaropoulos et al., 2012). Importantly, those data were obtained in a no-report paradigm" },
]
test_for = "Features of a stimulus that the person consciously sees (its category, orientation, identity) can be decoded from prefrontal activity, including when the stimulus or the feature is irrelevant to the task and nothing is reported."
test_against = "A feature the person consciously sees can be decoded from sensory cortex but not from prefrontal cortex, in a design sensitive enough to find it in prefrontal cortex for other features."
separates_from = [
  { theory = "iit", how = "IIT places conscious content mainly in posterior cortex and predicts it is maximally decodable there, with prefrontal cortex adding nothing.", source = "cogitate-prereg-v1" },
]

