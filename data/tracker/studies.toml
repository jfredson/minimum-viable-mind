# Studies: who settles a prediction. Each carries its earliest public appearance
# (registration, preprint or publication, whichever came first: kickoff section 12,
# rule 2.3), its research group, and the four protections that set its weight
# (section 4, ruled): weight = 1 + one for each protection, up to 5.
#
# "camps" lists the theories whose proponents ran the study. The outside-camp
# protection is judged per theory: a study run inside GWT's camp is not outside
# GWT's camp, but may be outside IIT's.
#
# How the pilot's sample was chosen (stated so it can be checked and redone):
# (1) the Cogitate Consortium's adversarial test, named in the brief; (2) the five
# most recent rows in ConTraSt's live export (downloaded 2026-11-20) marked as
# designed to test a theory and naming both global workspace theory and integrated
# information theory among the theories they were designed around; (3) for the
# Sentient Horizons account, the studies its own Working Positions page cites for
# its predictions. ConTraSt is a reading list only: no ConTraSt field is copied here,
# and every record is built from the paper itself. Found through ConTraSt is said
# on each record that was. Credit: the ConTraSt database (Yaron, Melloni, Pitts and
# Mudrik, Nature Human Behaviour 2022), https://contrastdb.tau.ac.il, CC BY-SA 4.0.
#
# Layout: data/tracker/README.md.

[[study]]
id = "cogitate-2025"
name = "The Cogitate Consortium's adversarial test of global workspace and integrated information theory"
source = "cogitate-2025"
first_appeared = { date = "2019-01-16", what = "registration (preregistration v1 on OSF)", source = "cogitate-prereg-v1" }
data_collected = { when = "after 2019-01-16", reason = "The registration was created on OSF on 2019-01-16, and the protocol says the original and amended registrations were frozen before data acquisition began.", passage = "The original and the amended preregistration files were frozen prior to the commencement of data acquisition.", source = "cogitate-protocol-2023" }
first_appeared_note = "Under the after-the-fact rule as ruled on 2026-11-20 ('Yes, count it'), what decides is when a prediction was fixed against when the study's data were collected, not public dates. The registration (created on OSF 2019-01-16) fixed its predictions before data acquisition, so they count for this study. The preprint appeared 2023-06-26 (cogitate-preprint-2023) and the paper 2025-04-30."
group = "Cogitate Consortium"
camps = []
found_through = "brief"
opened = true
protections.registered = { value = true, reason = "Predictions, pass or fail criteria and interpretations registered before data acquisition.", passage = "The original and the amended preregistration files were frozen prior to the commencement of data acquisition.", source = "cogitate-protocol-2023" }
protections.outside_camp = { value = true, reason = "Data were collected and analysed by theory-neutral teams, kept apart from the theories' proponents, although the proponents helped design the study and are among its authors.", passage = "All research was conducted by theory-neutral teams to minimize confirmatory bias.", source = "cogitate-2025", judgement = "A judgement: the proponents co-designed the test and co-wrote the paper. Read as outside-camp because the protection is about who ran it, and they did not run it." }
protections.rival_agreed = { value = true, reason = "Both theories' proponents agreed the predictions and what would count as pass or fail before the data came in.", passage = "We preregistered these predictions, including pass or fail criteria, expected outcomes and their interpretation ex-ante", source = "cogitate-2025" }
protections.replicated = { value = false, reason = "The paper reports an in-house replication (an optimisation third of the data, then the remaining two-thirds), which is the same consortium, not another group. Two independent studies are said to align with one result (no offset representation in prefrontal cortex), but that is one result, not a replication of the study.", passage = "These results align with two independent studies using comparable methods42,43.", source = "cogitate-2025" }

