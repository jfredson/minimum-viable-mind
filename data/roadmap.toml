# Minimum Viable Mind — the weekend roadmap the site renders at /roadmap/.
#
# The structured twin of docs/weekend-roadmap-2026-09-24.md (sections 3 and
# 7). This file is the source of record for each weekend's goals and their
# status; the markdown file stays the narrative (why the plan is shaped this
# way, and the weekend log in prose). The Thursday/Friday re-plan edits both,
# and the Sunday-night handoff sets each goal's status here.
#
# Plain language, every code name explained on first use, same rule as
# data/project.toml. Dates are Pacific (YYYY-MM-DD).
#
# Vocabularies (validated by scripts/export_site.py):
#   weekend.status: "planned" | "active" | "done" | "partial" | "blackout" | "slack"
#   goal.status:    "planned" | "done" | "carried" | "dropped" | "not_needed"
#   goal.owner:     "john" | "agents" | "both"
#   milestone.kind: "kill_date" | "wrap_up" | "hibernation"
#   extension.status: "proposed" | "authorised" | "running" | "done" | "deferred" | "declined"
#
# "carried" means the goal moved to a later weekend (say which in `note`). A
# carried goal is NEVER copied into the later weekend: it stays here with its
# id, status "carried" and the note, and the page counts it as not yet done.
# When it lands, set it to "done" here (ruled 2026-09-24, so no goal is ever
# counted twice).
# "not_needed" means a branch that did not fire (for example a re-run that was
# not required). Neither counts against progress; "dropped" does.

[roadmap]
title = "The weekend roadmap to 2026-12-21"
written_on = "2026-09-24"
updated_on = "2026-10-09"
source = "docs/weekend-roadmap-2026-09-24.md"
one_line = "No longer a schedule (ruled 2026-10-04, docs/rulings/2026-10-04-no-future-dates.md): each step now runs as soon as what it waits on is done, and the dates below are the plan as it stood, not targets. The kill dates, the wrap-up start and the hibernation deadline still bind as outer limits. As first written: twelve working weekends between 2026-09-26 and 2026-12-20, front-loaded so that both kill dates pass with their work already done, the December result exists by 2026-11-08, and five weekends stay in hand for slipped gates and for the extensions that make the conclusion stronger."
question = "Can a decomposability measure, validated on systems whose degree is known by construction, read the degree of a freely trained 30-million-parameter transformer that acquired a load-bearing ownership pointer under task pressure? If so, what does it read?"
wrap_up_start = "2026-12-21"
hibernation_by = "2027-01-04"
weekday_rule = "Retired 2026-10-04 (docs/rulings/2026-10-04-no-future-dates.md). Work is no longer split between weekdays and weekends: each step runs as soon as what it waits on is done, and a step that waits on John (a ruling, a go, the outside-review sessions) waits on him without a date. As first written: weekdays carry rulings and spoken go's only, from a queue a session pre-assembles; weekends carry the reviewer sessions John runs by hand and the launches; agents run unattended between weekends."
replan_rule = "Retired 2026-10-04 (docs/rulings/2026-10-04-no-future-dates.md): there is no weekly re-plan and no Sunday-night handoff. Kill dates and the wrap-up start still never move. As first written: every Thursday or Friday evening the coming weekend is re-planned from the top of STATUS.md, and the re-plan names which weekend absorbs a slip."

# Fixed dates the plan is held to. These never move.
[[milestones]]
id = "K1"
date = "2026-10-18"
title = "Kill date 1: the registration committed"
kind = "kill_date"
note = "Past it, committing is still possible only on a fresh ruling naming what comes off the back end (ruled 2026-09-21)."

[[milestones]]
id = "K2"
date = "2026-11-01"
title = "Kill date 2: the remaining eight registered runs launched"
kind = "kill_date"
note = "Binds the launch of the eight runs of step 5b, not the single free-arm run before it (ruled 2026-09-21). Dated note 2026-10-07: struck and then restored the same day; the second release is kept, conditional, so this date binds step 5b as before. No new calendar dates were set; the project's new lines are ordered steps with preconditions (docs/rulings/2026-10-07-two-sided-question-rulings.md, decisions 3 and 4 as revised after the Gate C pass)."

[[milestones]]
id = "W"
date = "2026-12-21"
title = "Wrap-up starts; nothing new launches after this"
kind = "wrap_up"

[[milestones]]
id = "H"
date = "2027-01-04"
title = "Hibernation condition complete; the SERE pipeline starts"
kind = "hibernation"

