# ---------------------------------------------------------------------------
# The extensions the back half of the block can take, ranked. None is
# authorised by this file; each is its own registration with its own Gate A,
# and each that trains anything is an envelope ruling (about $36 each).
# ---------------------------------------------------------------------------

[[extensions]]
id = "E0"
title = "A fourth arm, partially separable by construction"
when = "Folded into the main registration if the rehearsal can build it in weekend 1"
cost = "one more architecture; three more 30-million-parameter runs, about $36"
teaches = "Without a middle case, a free-arm reading at the entangled end cannot be told from a ceiling. This is the single change that most improves what outcome R1 can say."
status = "proposed"

[[extensions]]
id = "E1"
title = "Tighter uncertainty on the free arm's degree"
when = "If R1; proposed after Gate B in weekend 5, runs in weekend 8"
cost = "three more free-arm seeds, about $36"
teaches = "A paired uncertainty across six seeds rather than three."
status = "proposed"

[[extensions]]
